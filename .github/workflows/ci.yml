name: chargewire-adbc-ci

# Unit tests, the C shared library on every platform and its exports (only Adbc*,
# go/internal/checkexports), the Python bindings, the live-server suites (Go and Python), the
# Python suite at both ends of what the package supports (Python 3.10 with the lowest dependency
# versions, Python 3.15 with the latest) and the ADBC validation (conformance) suite (validation/)
# against hardcharger-server. Also the release gate: release.yml calls it on the tagged commit.
#
# The live suites' server comes from the image ghcr.io/gizmodata/hardcharger, pulled with this
# workflow's GITHUB_TOKEN. While the image is private that works only once the package grants
# this repository read access (package settings, Manage Actions access); no personal token.
# Once the image is public the login is unnecessary but harmless. HARDCHARGER_IMAGE
# must be a build whose server splits results (--max-result-partitions). The suites fail,
# never skip, without a server, and the Go suite fails when no integration test ran.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Hardcharger's main branch, published by its CI on every green push (:main; :sha-<short>
  # for a fixed build). Pin a :sha- here to reproduce a run.
  HARDCHARGER_IMAGE: ghcr.io/gizmodata/hardcharger:main

# A newer run on the same branch makes an older one pointless: cancel it. Never on a tag:
# a release run must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Decides whether this run is about code (code=true) or documentation only (code=false). Every
  # other job needs it and runs only when code=true; "CI result" at the end is the one required
  # check. code=false only when every changed file is *.md, docs/**, LICENSE, NOTICE or
  # .github/ISSUE_TEMPLATE/** (workflow files are code). Tags, workflow_dispatch, schedule and any
  # other event (including release.yml calling this workflow, which carries the caller's tag push
  # or dispatch) always test everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Code or documentation only?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          code=true
          range=
          case "$EVENT:$REF" in
            *:refs/tags/*) reason="a tag ($REF)" ;;
            pull_request:*) range="$PR_BASE...$SHA" ;;
            push:refs/heads/*)
              if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
                reason="a new branch"
              elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                reason="the previous head $BEFORE is not in the history (force push)"
              else
                range="$BEFORE..$SHA"
              fi
              ;;
            *) reason="a $EVENT run on $REF" ;;
          esac
          if [ -n "$range" ]; then
            # --no-renames: a rename lists both paths, so moving code into docs/ is still code.
            files=$(git diff --no-renames --name-only "$range")
            count=0
            code=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              count=$((count + 1))
              case "$f" in
                *.md | docs/* | LICENSE | NOTICE | .github/ISSUE_TEMPLATE/*) echo "docs: $f" ;;
                *) echo "code: $f"; code=true ;;
              esac
            done <<< "$files"
            if [ "$count" -eq 0 ]; then
              code=true
              reason="no changed files in $range"
            elif [ "$code" = true ]; then
              reason="code changed in $range"
            else
              reason="only documentation changed in $range ($count files)"
            fi
          fi
          echo "code=$code ($reason)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "**Changes:** code=\`$code\` ($reason)" >> "$GITHUB_STEP_SUMMARY"

  go:
    name: go and python (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: gofmt
        working-directory: go
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        working-directory: go
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Unit tests
        working-directory: go
        run: make test

      - name: Third-party notices are current (scripts/third_party_notices.sh)
        if: runner.os == 'Linux'
        run: scripts/third_party_notices.sh --check

      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: 0.17.0

      - name: Build the shared library
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"  # Go 1.27 requires macOS 13 (go.dev/doc/go1.27)
        run: scripts/build_lib.sh

      - name: The library exports only the ADBC entrypoints (Adbc*)
        working-directory: go
        run: |
          case "$RUNNER_OS" in macOS) ext=dylib ;; *) ext=so ;; esac
          go run ./internal/checkexports "build/libadbc_driver_chargewire.$ext"

      - name: Check the glibc ceiling (2.17)
        if: runner.os == 'Linux'
        run: scripts/check_glibc.sh go/build/libadbc_driver_chargewire.so

      - name: The library's minimum macOS is 13.0
        if: runner.os == 'macOS'
        run: |
          minos=$(vtool -show-build go/build/libadbc_driver_chargewire.dylib | awk '/minos/ {print $2}')
          [ "$minos" = "13.0" ] || { echo "::error::the library's minos is ${minos:-unknown}, not 13.0"; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Python lint and unit tests (against the built library)
        working-directory: python
        run: |
          pip install -e ".[test,dev]"
          ruff check src tests
          ruff format --check src tests
          python -m pytest -m "not integration" tests

      - name: Build the wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          cp go/build/libadbc_driver_chargewire.* python/src/adbc_driver_chargewire/
          rm python/src/adbc_driver_chargewire/libadbc_driver_chargewire.h
          cd python && python -m build --wheel && ls -la dist/

  lib:
    name: library (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: 0.17.0

      - name: Build the shared library
        shell: bash
        run: scripts/build_lib.sh

      - name: The library exports only the ADBC entrypoints (Adbc*)
        shell: bash
        working-directory: go
        run: |
          case "$RUNNER_OS" in Windows) ext=dll ;; *) ext=so ;; esac
          go run ./internal/checkexports "build/libadbc_driver_chargewire.$ext"

      - name: Check the glibc ceiling (2.17)
        if: runner.os == 'Linux'
        run: scripts/check_glibc.sh go/build/libadbc_driver_chargewire.so

  live:
    name: live-server suites (Go and Python, against hardcharger-server)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read  # the server image
    env:
      CHARGEWIRE_ADBC_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_ADMIN_PASSWORD
      CHARGEWIRE_ADBC_TEST_SERVER_MTLS_FLAG: --mtls-ca-cert
      CHARGEWIRE_ADBC_TEST_SERVER_USERNAME_FLAG: --admin-username
      CHARGEWIRE_ADBC_TEST_SERVER_NAME: Hardcharger
      CHARGEWIRE_ADBC_TEST_SERVER_IDLE_IN_TRANSACTION_FLAG: --idle-in-transaction-session-timeout
    steps:
      - uses: actions/checkout@v7

      - name: hardcharger-server from the image
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          if ! docker pull -q "$HARDCHARGER_IMAGE"; then
            echo "::error::can't pull $HARDCHARGER_IMAGE with this workflow's GITHUB_TOKEN: grant $GITHUB_REPOSITORY read access to the hardcharger package (package settings, Manage Actions access)"
            exit 1
          fi
          id=$(docker create "$HARDCHARGER_IMAGE")
          docker cp "$id:/opt/hardcharger" "$RUNNER_TEMP/hardcharger"
          docker rm "$id" >/dev/null
          binary="$RUNNER_TEMP/hardcharger/bin/hardcharger-server"
          "$binary" --version
          echo "CHARGEWIRE_ADBC_TEST_SERVER_BINARY=$binary" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The race detector and a checked Arrow allocator; fails when no integration test ran.
      - name: Go live suite
        run: make -C go integration-test

      - name: Build the shared library
        run: scripts/build_lib.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Python suite (unit and live)
        working-directory: python
        run: |
          pip install -e ".[test]"
          python -m pytest -v tests

  # The Python suite (unit and live) at both ends of what python/pyproject.toml declares:
  # Python 3.10 with exactly the lowest versions it allows (uv's lowest-direct resolution: the
  # floors are dlt's, see the comments next to them), and Python 3.15 with the latest. The lowest
  # entry fails when what got installed is not the floors, so the floors can't drift from what is
  # tested. On an Arm runner (the server image has both architectures).
  python:
    name: python ${{ matrix.python }}, ${{ matrix.versions }} versions (live, against hardcharger-server)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            versions: lowest
            resolution: lowest-direct
          - python: "3.15"
            versions: latest
            resolution: highest
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read  # the server image
    env:
      CHARGEWIRE_ADBC_TEST_SERVER_PASSWORD_ENV: HARDCHARGER_ADMIN_PASSWORD
      CHARGEWIRE_ADBC_TEST_SERVER_MTLS_FLAG: --mtls-ca-cert
      CHARGEWIRE_ADBC_TEST_SERVER_USERNAME_FLAG: --admin-username
      CHARGEWIRE_ADBC_TEST_SERVER_NAME: Hardcharger
      CHARGEWIRE_ADBC_TEST_SERVER_IDLE_IN_TRANSACTION_FLAG: --idle-in-transaction-session-timeout
    steps:
      - uses: actions/checkout@v7

      - name: hardcharger-server from the image
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          if ! docker pull -q "$HARDCHARGER_IMAGE"; then
            echo "::error::can't pull $HARDCHARGER_IMAGE with this workflow's GITHUB_TOKEN"
            exit 1
          fi
          id=$(docker create "$HARDCHARGER_IMAGE")
          docker cp "$id:/opt/hardcharger" "$RUNNER_TEMP/hardcharger"
          docker rm "$id" >/dev/null
          binary="$RUNNER_TEMP/hardcharger/bin/hardcharger-server"
          "$binary" --version
          echo "CHARGEWIRE_ADBC_TEST_SERVER_BINARY=$binary" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build the shared library
        run: scripts/build_lib.sh

      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install (Python ${{ matrix.python }}, ${{ matrix.versions }} versions)
        working-directory: python
        run: |
          uv venv .venv --python "${{ matrix.python }}"
          uv pip install --python .venv/bin/python --resolution "${{ matrix.resolution }}" -e ".[test]"
          uv pip list --python .venv/bin/python
      - name: What is installed is exactly the floors in pyproject.toml
        if: matrix.versions == 'lowest'
        working-directory: python
        run: |
          set -euo pipefail
          for package in adbc-driver-manager pyarrow; do
            floor=$(sed -n "s/^ *\"$package>=\([0-9.]*\)\".*/\1/p" pyproject.toml)
            have=$(uv pip show --python .venv/bin/python "$package" | sed -n 's/^Version: //p')
            echo "$package: floor ${floor:-none found}, installed ${have:-nothing}"
            if [ -z "$floor" ] || [ "$floor" != "$have" ]; then
              echo "::error::$package: pyproject.toml's floor is '${floor}', but '${have}' is installed"
              exit 1
            fi
          done
          have=$(.venv/bin/python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          floor=$(sed -n 's/^requires-python = ">=\([0-9.]*\)".*/\1/p' pyproject.toml)
          echo "python: floor ${floor:-none found}, running $have"
          if [ -z "$floor" ] || [ "$floor" != "$have" ]; then
            echo "::error::requires-python's floor is '${floor}', but this job runs Python $have"
            exit 1
          fi
      - name: Python suite (unit and live)
        working-directory: python
        run: .venv/bin/python -m pytest -v -rs tests

  # The ADBC validation (conformance) suite (validation/; pinned in validation/requirements.txt,
  # a test dependency only), against a server whose catalog is `validation`, through the library
  # built as for a release. It fails, never skips, without its server; the first run proves that
  # on every build. The server runs with TZ=UTC: the suite expects TIMESTAMPTZ as
  # timestamp[tz=UTC].
  validation:
    name: ADBC validation suite (linux, against hardcharger-server)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read  # the server image
    steps:
      - uses: actions/checkout@v7

      - name: hardcharger-server from the image
        env:
          TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          if ! docker pull -q "$HARDCHARGER_IMAGE"; then
            echo "::error::can't pull $HARDCHARGER_IMAGE with this workflow's GITHUB_TOKEN"
            exit 1
          fi
          id=$(docker create "$HARDCHARGER_IMAGE")
          docker cp "$id:/opt/hardcharger" "$RUNNER_TEMP/hardcharger"
          docker rm "$id" >/dev/null
          binary="$RUNNER_TEMP/hardcharger/bin/hardcharger-server"
          "$binary" --version
          echo "SERVER_BINARY=$binary" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build the shared library
        run: scripts/build_lib.sh
      - name: The library exports only the ADBC entrypoints (Adbc*)
        working-directory: go
        run: go run ./internal/checkexports build/libadbc_driver_chargewire.so

      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install the suite (Python 3.14)
        working-directory: validation
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: The suite fails when its server is unreachable
        working-directory: validation
        env:
          CHARGEWIRE_ADBC_TEST_VALIDATION_URI: chargewire://127.0.0.1:9?tls=false
          CHARGEWIRE_ADBC_TEST_VALIDATION_USERNAME: nobody
          CHARGEWIRE_ADBC_TEST_VALIDATION_PASSWORD: nothing
        run: |
          # The step's shell is bash -e: the expected failure is tested in a condition.
          if .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_connection.py > unreachable.log 2>&1; then
            cat unreachable.log
            echo "::error::the suite passed without a server"
            exit 1
          fi
          tail -3 unreachable.log
          if ! grep -q "can't reach the server at chargewire://127.0.0.1:9" unreachable.log; then
            cat unreachable.log
            echo "::error::the suite failed for another reason"
            exit 1
          fi

      - name: Start a server for the suite
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 12):p@ss"
          echo "::add-mask::$password"
          mkdir -p "$RUNNER_TEMP/validation"
          # The server runs until the job ends (the runner stops what it started).
          (cd "$RUNNER_TEMP/validation" && { env -i PATH="$PATH" HOME="$RUNNER_TEMP/validation" \
            TZ=UTC HARDCHARGER_ADMIN_PASSWORD="$password" "$SERVER_BINARY" \
            --host 127.0.0.1 --port 31470 --health-port 0 --admin-username cw_adbc_validation \
            --database "$RUNNER_TEMP/validation/validation.duckdb" --print-queries false \
            > server.log 2>&1 & })
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:31470/chargewire && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:31470/chargewire
          {
            echo "CHARGEWIRE_ADBC_TEST_VALIDATION_URI=chargewire://127.0.0.1:31470?tls=false"
            echo "CHARGEWIRE_ADBC_TEST_VALIDATION_USERNAME=cw_adbc_validation"
            echo "CHARGEWIRE_ADBC_TEST_VALIDATION_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Run the suite
        working-directory: validation
        run: .venv/bin/python -m pytest -p no:cacheprovider -rfEsxX --junit-xml=validation-report.xml
      - name: Server log
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/validation/server.log" ]; then tail -100 "$RUNNER_TEMP/validation/server.log"; else echo "no server was started"; fi

  # The one required status check. It fails when any job failed or was cancelled, and when the
  # change is code but a job that must run was skipped; for a documentation-only change the
  # skipped jobs pass. Jobs in OPTIONAL skip by their own conditions (tag-only publishing).
  ci-result:
    name: CI result
    if: always()
    needs: [changes, go, lib, live, python, validation]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped for a documentation-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          OPTIONAL: ""
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<< "$NEEDS")
          if [ "$changes" != success ] || { [ "$CODE" != true ] && [ "$CODE" != false ]; }; then
            echo "::error::the Changes job didn't decide (result: $changes, code: '$CODE')"
            exit 1
          fi
          failed=0
          while read -r job result; do
            optional=false
            for o in $OPTIONAL; do if [ "$o" = "$job" ]; then optional=true; fi; done
            case "$result" in
              success) echo "ok       $job" ;;
              skipped)
                if [ "$CODE" = true ] && [ "$optional" = false ]; then
                  echo "::error::$job was skipped, but this change is code: it must run"
                  failed=1
                else
                  echo "skipped  $job"
                fi
                ;;
              *) echo "::error::$job: $result"; failed=1 ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          exit "$failed"
