[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adbc_driver_chargewire = ["libadbc_driver_chargewire.*", "THIRD_PARTY_NOTICES"]

[project]
name = "adbc-driver-chargewire"
version = "2.3.0"
description = "Python ADBC driver for the Chargewire protocol (SQL over HTTP with Arrow), backed by a native Go driver"
readme = "README.md"
license = "Apache-2.0"
# Floors below the latest releases, on purpose: dlt (dlt-hub/dlt) supports Python 3.10 to 3.14
# with pyarrow>=16.0.0 and adbc-driver-manager>=1.8.0, and a driver that cannot install across
# dlt's range, or forces its locked versions up, cannot be a dependency of one of its destinations.
# CI's "lowest versions" job runs the whole Python suite on Python 3.10 with exactly these floors.
requires-python = ">=3.10"
authors = [
    { name = "GizmoData", email = "support@gizmodata.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
]
dependencies = [
    # dlt's floor (its `adbc` dependency group; its lock file has 1.9.0). Connection profiles
    # (connect(profile=...)) are the driver manager's own feature from 1.11.0: with an older one
    # the driver refuses the option and says so. Python 3.15 needs 1.13.0, the first with wheels.
    "adbc-driver-manager>=1.8.0",
    # dlt's floor. Python 3.13 needs 18.0.0, 3.14 needs 22.0.0 and 3.15 needs 26.0.1 (wheels).
    "pyarrow>=16.0.0",
]

[project.urls]
Homepage = "https://github.com/gizmodata/chargewire-adbc"
Repository = "https://github.com/gizmodata/chargewire-adbc"

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
    "cryptography>=50.0.2",
]
dev = [
    "ruff>=0.17.4",
    "build>=1.6.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live Chargewire server (CHARGEWIRE_ADBC_TEST_SERVER_BINARY); fails without one",
]
