[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adbc_driver_chargewire = ["libadbc_driver_chargewire.*", "THIRD_PARTY_NOTICES"]

[project]
name = "adbc-driver-chargewire"
version = "1.0.0"
description = "Python ADBC driver for the Chargewire protocol (SQL over HTTP with Arrow), backed by a native Go driver"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"  # pyarrow 26 needs 3.11
authors = [
    { name = "GizmoData", email = "support@gizmodata.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "adbc-driver-manager>=1.12.0",
    "pyarrow>=26.0.0",
]

[project.urls]
Homepage = "https://github.com/gizmodata/chargewire-adbc"
Repository = "https://github.com/gizmodata/chargewire-adbc"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "cryptography>=50.0.2",
]
dev = [
    "ruff>=0.17.1",
    "build>=1.6.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live Chargewire server (CHARGEWIRE_ADBC_TEST_SERVER_BINARY); fails without one",
]
